<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- El isotipo maestro (docs/branding/logo/contexto-isotipo.svg, copiado por genera_iconos.py).
         Nombre nuevo a propósito: Chrome guarda los favicons aparte y así vuelve a pedirlo. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- SIN viewport-fit=cover a propósito. Con él, en la PWA instalada de Android el
         viewport se extiende POR DEBAJO de la barra de navegación del sistema: innerHeight
         (y dvh, y svh, y visualViewport) reportaban 750px cuando lo visible eran ~694, y la
         fila de botones de la barra de escribir quedaba tapada por la barra del sistema.
         Y no había forma de descontarlo: Chrome de Android reporta env(safe-area-inset-*)
         en 0 incluso en modo instalado (medido en el aparato). Sin esta declaración el
         navegador insetea el viewport él mismo, que es justo lo que hace falta. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C1C1C" />

    <!-- PWA: instalable en el teléfono (ícono en inicio, abre en / → directo al agente) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS pide 180x180 y compone sobre el icono su propia máscara; con /icon-192.png
         lo reescalaba. Ambos salen de docs/branding/logo/genera_iconos.py. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Contexto" />
    <meta name="description" content="Contexto — Cada lugar tiene un aura. La IA inmobiliaria que verifica el entorno antes de recomendarlo. Inteligencia geoespacial inmobiliaria en Quito." />
    <title>Contexto · Cada lugar tiene un aura</title>

    <!-- Open Graph / compartir en redes (LinkedIn, WhatsApp, Slack…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Contexto" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:title" content="Contexto · Cada lugar tiene un aura" />
    <meta property="og:description" content="La IA inmobiliaria que verifica el entorno antes de recomendarlo: caminabilidad real, colegios, ruido y a cuántos minutos a pie está todo." />
    <meta property="og:url" content="https://contexxto.com/" />
    <meta property="og:image" content="https://contexxto.com/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Contexto — Cada lugar tiene un aura" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Contexto · Cada lugar tiene un aura" />
    <meta name="twitter:description" content="La IA inmobiliaria que verifica el entorno antes de recomendarlo." />
    <meta name="twitter:image" content="https://contexxto.com/og-cover.png" />
    <!-- Rendimiento: conexiones adelantadas (DNS/TLS) + fuentes SIN la cadena @import del CSS
         (el @import obligaba a: descargar CSS → descubrir el import → otra ronda de red antes
         de pintar texto). El <link> aquí arranca la descarga junto con el HTML. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" />

    <!-- Tema anti-flash: aplica dark/light antes de renderizar -->
    <script>
      try {
        var t = localStorage.getItem('contexto_theme') === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        // La barra del sistema sigue el tema de la APP, no el del sistema operativo. Por eso
        // NO se usa <meta name="theme-color" media="(prefers-color-scheme: …)">: el tema vive
        // en localStorage (theme.js), así que con el teléfono en oscuro y la app en claro esa
        // variante dejaría la barra negra sobre una app blanca. Los dos literales son los --bg
        // de index.css y un test (temaBarra.test.js) se pone rojo si el token cambia y esto no.
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#FFFFFF' : '#1C1C1C');
      } catch (e) {}
    </script>
    <!-- Warm-up del backend (Render se duerme tras inactividad y el primer golpe del día
         tarda 30-60s): este ping lo despierta APENAS carga el HTML, en paralelo a que el
         usuario lee/escribe — cuando envía su primer mensaje, el backend ya va despierto. -->
    <script>
      try { fetch('%VITE_API_URL%/health', { mode: 'cors' }).catch(function () {}) } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
