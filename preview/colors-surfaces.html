<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<title>Superficies · Dark</title>
<link rel="stylesheet" href="_base.css">
</head>
<body>
<div class="card">
  <p class="eyebrow">SUPERFICIES · DARK SYSTEM</p>
  <div class="row">
    <div class="swatch">
      <div class="chip" style="background:#1C1C1C"></div>
      <p class="name">Background</p>
      <span class="hex">#1C1C1C</span>
      <span class="role">CANVAS</span>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#282828"></div>
      <p class="name">Surface 1</p>
      <span class="hex">#282828</span>
      <span class="role">PANELS · APP BG</span>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#2E2E2E"></div>
      <p class="name">Surface 2</p>
      <span class="hex">#2E2E2E</span>
      <span class="role">CARDS · CONTAINERS</span>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#3A3A3A"></div>
      <p class="name">Border</p>
      <span class="hex">#3A3A3A</span>
      <span class="role">BORDES · DIVIDERS</span>
    </div>
  </div>
  <div class="row" style="margin-top:4px;">
    <div class="swatch">
      <div class="chip" style="background:#FFFFFF"></div>
      <p class="name">Texto</p>
      <span class="hex">#FFFFFF</span>
      <span class="role">TEXTO PRINCIPAL</span>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#C9C9C9"></div>
      <p class="name">Muted</p>
      <span class="hex">#C9C9C9</span>
      <span class="role">SECUNDARIO · META</span>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#959595"></div>
      <p class="name">Dim</p>
      <span class="hex">#959595</span>
      <span class="role">TERCIARIO · TIMESTAMPS</span>
    </div>
    <div class="swatch" style="opacity:0; pointer-events:none;">
      <div class="chip"></div>
    </div>
  </div>
</div>
</body></html>
